<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>DICOM 医学影像浏览器</title>
    <link rel="icon" type="image/png" href="../../img/logo.png">

    <!-- 第三方库 -->
    <script src="lib/dicomParser.min.js"></script>
    <script src="lib/hammer.min.js"></script>
    <script src="lib/cornerstone.min.js"></script>
    <script src="lib/cornerstoneMath.min.js"></script>
    <script src="lib/cornerstoneTools.min.js"></script>
    <script src="lib/cornerstoneWebImageLoader.min.js"></script>
    <script src="lib/cornerstoneWADOImageLoader.bundle.min.js"></script>

    <!-- 样式 -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ========== 顶部工具栏 ========== -->
    <header class="toolbar">
        <div class="toolbar-brand">
            <img src="../../img/logo.png" alt="DICOM" class="logo">
            <h1>DICOM 影像浏览器</h1>
        </div>

        <div class="toolbar-separator"></div>

        <!-- 布局切换 -->
        <div class="toolbar-group">
            <span class="toolbar-label">布局</span>
            <button class="tool-btn layout-btn active" data-layout="1x1" title="单视图">
                <span class="icon">⊞</span><span class="label">1×1</span>
            </button>
            <button class="tool-btn layout-btn" data-layout="1x2" title="左右双视图">
                <span class="icon">⊞</span><span class="label">1×2</span>
            </button>
            <button class="tool-btn layout-btn" data-layout="2x1" title="上下双视图">
                <span class="icon">⊞</span><span class="label">2×1</span>
            </button>
            <button class="tool-btn layout-btn" data-layout="2x2" title="四视图">
                <span class="icon">⊞</span><span class="label">2×2</span>
            </button>
        </div>

        <div class="toolbar-separator"></div>

        <!-- 同步控制 -->
        <div class="toolbar-group">
            <span class="toolbar-label">同步</span>
            <button class="tool-btn sync-on" data-sync="scroll" title="滚动同步">📜</button>
            <button class="tool-btn sync-on" data-sync="zoom" title="缩放同步">🔍</button>
            <button class="tool-btn sync-on" data-sync="voi" title="窗宽窗位同步">☀</button>
        </div>

        <div class="toolbar-separator"></div>

        <!-- 预设 -->
        <div class="toolbar-group">
            <span class="toolbar-label">预设</span>
            <select id="presetSelect" class="preset-select">
                <option value="">— 选择预设 —</option>
            </select>
        </div>

        <div class="toolbar-separator"></div>

        <!-- 工具按钮 -->
        <div class="toolbar-group">
            <span class="toolbar-label">工具</span>
            <button class="tool-btn active" data-tool="Wwwc" title="窗宽窗位 (左键默认)">
                <span class="icon">☀</span><span class="label">窗宽窗位</span>
            </button>
            <button class="tool-btn" data-tool="Pan" title="平移 (右键)">
                <span class="icon">✋</span><span class="label">平移</span>
            </button>
            <button class="tool-btn" data-tool="Zoom" title="缩放 (中键/滚轮+Ctrl)">
                <span class="icon">🔍</span><span class="label">缩放</span>
            </button>
            <button class="tool-btn" data-tool="Length" title="长度测量">
                <span class="icon">📏</span><span class="label">长度</span>
            </button>
            <button class="tool-btn" data-tool="Angle" title="角度测量">
                <span class="icon">📐</span><span class="label">角度</span>
            </button>
            <button class="tool-btn" data-tool="EllipticalRoi" title="椭圆 ROI">
                <span class="icon">⭕</span><span class="label">椭圆 ROI</span>
            </button>
            <button class="tool-btn" data-tool="ArrowAnnotate" title="箭头标注">
                <span class="icon">➡</span><span class="label">标注</span>
            </button>
        </div>

        <div class="toolbar-separator"></div>

        <!-- 操作按钮 -->
        <div class="toolbar-group">
            <button class="tool-btn" id="resetViewBtn" title="重置视图">
                <span class="icon">↺</span><span class="label">重置</span>
            </button>
            <button class="tool-btn" id="toggleOverlay" title="切换信息叠加层">
                <span class="icon">📋</span><span class="label">信息</span>
            </button>
            <button class="tool-btn" id="clearMeasurementsBtn" title="清除测量">
                <span class="icon">🗑</span><span class="label">清除</span>
            </button>
            <button class="tool-btn" id="exportBtn" title="导出影像" style="color:var(--text-success);">
                <span class="icon">📤</span><span class="label">导出</span>
            </button>
        </div>
    </header>

    <!-- ========== 主体 ========== -->
    <div class="app-body">

        <!-- 左侧面板 -->
        <aside class="sidebar">
            <div class="sidebar-section">
                <div class="sidebar-header">
                    <span>序列列表</span>
                    <span id="seriesCount" class="action-btn">0</span>
                </div>
                <div class="series-list" id="seriesList">
                    <div style="padding: 20px; text-align: center; color: var(--text-muted); font-size: 13px;">
                        暂无数据<br>点击下方按钮导入 DICOM 文件夹
                    </div>
                </div>
            </div>

            <!-- 导入区域 -->
            <div class="import-area">
                <button class="import-btn" id="importBtn">
                    <span class="icon">📂</span>
                    <span>导入 DICOM 文件夹</span>
                </button>
                <input type="file" id="folderInput" webkitdirectory multiple accept=".dcm,.dicom">
                <div style="margin-top: 8px; text-align: center;">
                    <button class="tool-btn" id="prevSliceBtn" title="上一张 (←)">◀</button>
                    <span id="statusSlice" style="margin: 0 8px; font-size: 12px; color: var(--text-muted);">0/0</span>
                    <button class="tool-btn" id="nextSliceBtn" title="下一张 (→)">▶</button>
                </div>
            </div>
        </aside>

        <!-- 视口区域 -->
        <main class="viewport-area">
            <div class="viewport-grid layout-1x1" id="viewportGrid">
                <!-- 视口由 JavaScript 动态生成 -->
            </div>
        </main>
    </div>

    <!-- ========== 底部状态栏 ========== -->
    <footer class="statusbar">
        <div class="statusbar-item">
            <span class="label">切片:</span>
            <span class="value" id="statusSlice">0/0</span>
        </div>
        <div class="statusbar-item">
            <span class="label">W:</span>
            <span class="value" id="statusWW">-</span>
        </div>
        <div class="statusbar-item">
            <span class="label">L:</span>
            <span class="value" id="statusWL">-</span>
        </div>
        <div class="statusbar-item">
            <span class="label">缩放:</span>
            <span class="value" id="statusZoom">-</span>
        </div>
        <div class="statusbar-right">
            <span style="font-size: 11px; color: var(--text-muted);">
                ← → 翻片  ·  滚轮 切层  ·  左键 窗宽窗位  ·  右键 平移  ·  R 重置  ·  Space 播放  ·  O 叠加层
            </span>
        </div>
    </footer>

    <!-- ========== 应用脚本 ========== -->
    <script src="js/state.js"></script>
    <script src="js/loader.js"></script>
    <script src="js/viewportManager.js"></script>
    <script src="js/overlay.js"></script>
    <script src="js/tools.js"></script>
    <script src="js/export.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
