    <title>旋转的立方体</title>
    
    <script id="vertex-shader" type="x-shader/x-vertex">
        #version 300 es
        in vec4 vPosition;
        in vec4 vColor;
        out vec4 aColor;

        uniform float thetaX; // X轴旋转角度
        uniform float thetaY; // Y轴旋转角度
        uniform float thetaZ; // Z轴旋转角度

        void main() {
            // X轴旋转
            float uX = cos(thetaX);
            float vX = sin(thetaX);
            vec4 rotatedX = vec4(
                vPosition.x,
                vPosition.y * uX - vPosition.z * vX,
                vPosition.y * vX + vPosition.z * uX,
                vPosition.w
            );

            // Y轴旋转
            float uY = cos(thetaY);
            float vY = sin(thetaY);
            vec4 rotatedY = vec4(
                rotatedX.x * uY + rotatedX.z * vY,
                rotatedX.y,
                -rotatedX.x * vY + rotatedX.z * uY,
                rotatedX.w
            );

            // Z轴旋转
            float uZ = cos(thetaZ);
            float vZ = sin(thetaZ);
            vec4 rotatedZ = vec4(
                rotatedY.x * uZ - rotatedY.y * vZ,
                rotatedY.x * vZ + rotatedY.y * uZ,
                rotatedY.z,
                rotatedY.w
            );

            gl_Position = rotatedZ;
            aColor = vColor;
        }
    </script>

    <script id="fragment-shader" type="x-shader/x-fragment">
        #version 300 es
        precision mediump float;
        in vec4 aColor;
        out vec4 fColor;

        void main() {
            fColor = aColor;
        }
    </script>
