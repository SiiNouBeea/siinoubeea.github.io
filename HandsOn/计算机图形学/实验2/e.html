<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="../../../img/logo.png">
<link rel="stylesheet" href="../../../css/design-system.css">
    <link rel="stylesheet" href="../../../css/styles_experiments.css">
<title>Triangle Tessellation – Rotation & Level</title>

<!-- ---------- 着色器 ---------- -->
<script id="vertex-shader" type="x-shader/x-vertex">#version 300 es
in vec4 vPosition;
void main(){ gl_Position = vPosition; }
</script>

<script id="fragment-shader" type="x-shader/x-fragment">#version 300 es
precision mediump float;
out vec4 fColor;
void main(){ fColor = vec4(1.0, 0.0, 0.0, 1.0); }
</script>

<!-- ---------- 库 ---------- -->
<script src="common/webgl-utils.js"></script>
<script src="common/initShaders.js"></script>
<script src="common/gl-matrix-min.js"></script>
<script src="js/e.js"></script>


</head>

<body>
    <!-- ========== 导航栏 ========== -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="../../../index.html" class="nav-logo">
                <img src="../../../img/logo.png" alt="SiiNouBeea" class="nav-logo-img">
                <span>SiiNouBeea</span>
            </a>
            <div class="nav-links">
                <a href="../../../index.html" class="nav-link">主页</a>
                <a href="../../index.html" class="nav-link">图形学</a>
                <a href="../index.html" class="nav-link active">实验2</a>
            </div>
            <button class="nav-toggle" aria-label="菜单" aria-expanded="false">☰</button>
        </div>
    </nav>

    <div class="experiment-page">
        <div class="breadcrumb">
            <a href="../../../index.html">主页</a>
            <span class="separator">›</span>
            <a href="../../index.html">计算机图形学</a>
            <span class="separator">›</span>
            <a href="../index.html">实验2</a>
            <span class="separator">›</span>
            <span class="current">Triangle Tessellation</span>
        </div>

        <h1 class="experiment-title">实验要求2：基于Sierpinski Gasket的扩展图案绘制</h1>

        <div class="experiment-description">
            <p>任务 C - 完成不同层次剖分效果的绘制，这里的绘制采用线框模式。</p>
            <p>任务 D - 任务c中剖分后的三角形添加旋转效果。</p>
            <p>任务 E - 在任务d中，如果旋转角度根据点到原点的距离d设定。</p>
        </div>

        <div class="canvas-container">
            <h2 style="margin-bottom: 15px; color: var(--text-primary);">Triangle Tessellation</h2>
            <canvas id="gl-canvas" class="experiment-canvas" width="600" height="600"></canvas>
        </div>

        <div class="controls-wrapper">
            <div class="controls-grid">
                <div class="control-group">
                    <label>细分层次：</label>
                    <input type="range" id="level-slider" min="0" max="7" value="0" oninput="updateLevel()" style="vertical-align: middle;">
                    <span id="levShow">0</span>
                </div>
                <div class="control-group">
                    <label>旋转角度：</label>
                    <input type="range" id="angle-slider" min="0" max="360" value="60" oninput="updateAngle()" style="vertical-align: middle;">
                    <span id="angShow">60°</span>
                </div>
                <div class="control-group">
                    <label>扭转强度：</label>
                    <input type="range" id="twist-slider" min="0" max="360" value="0" oninput="updateTwist()" style="vertical-align: middle;">
                    <span id="twistShow">0°</span>
                </div>
            </div>
        </div>

        <a href="index.html" class="btn btn-primary">返回实验列表</a>
    </div>

    <!-- ========== 页脚 ========== -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <span class="neon-signature">SiiNouBeea</span>
                <p class="footer-copyright">© 2025 SiiNouBeea. Made with ❤️</p>
            </div>
        </div>
    </footer>

    <script src="../../../js/main.js"></script>
</body>
</html>
