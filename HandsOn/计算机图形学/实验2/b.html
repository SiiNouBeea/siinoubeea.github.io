<title>Sierpinski Gasket 2D/3D</title>

<!-- ---------------- 彩色 3D 着色器（修改为支持 MVP 矩阵） ---------------- -->
<script id="vertex-shader" type="x-shader/x-vertex">#version 300 es
in vec3 vPosition;
in vec4 aColor;
out vec4 vColor;
uniform mat4 uMVP;

void main(){
    gl_Position = uMVP * vec4( vPosition, 1.0 );
    vColor = aColor;
}
</script>

<script id="fragment-shader" type="x-shader/x-fragment">#version 300 es
precision mediump float;

in vec4 vColor;
out vec4 fColor;
void main(){
    fColor = vColor;
}
</script>

<!-- ---------------- 原 2D 着色器 ---------------- -->
<script id="vs2d" type="x-shader/x-vertex">#version 300 es
in vec4 vPosition;
void main(){ gl_Position = vPosition; }
</script>
<script id="fs2d" type="x-shader/x-fragment">#version 300 es
precision mediump float;
out vec4 fColor;
void main(){ fColor = vec4(1.0,0.0,0.0,1.0); }
</script>

<script src="common/webgl-utils.js"></script>
<script src="common/initShaders.js"></script>
<script src="common/gl-matrix-min.js"></script>
<script src="js/b.js"></script>
</head>

        <h1 class="experiment-title">实验要求1：Sierpinski Gasket图案绘制</h1>

        <div class="experiment-description">
            <p>任务 A - 要求在网页上添加交互式控件，输入剖分的层次(0-7)，绘制对应图案。</p>
            <p>任务 B - 绘制三维效果的Sierpinski Gasket, 要求同任务a，也可与任务a集成在同一个界面中。</p>
        </div>

        <div class="canvas-container">
            <h2 style="margin-bottom: 15px; color: var(--text-primary);">Sierpinski Gasket – <span id="dimText">2D Triangle</span></h2>

        <div class="controls-wrapper">

                    </select>
                </div>
                <div class="control-group">
                    <label>细分层次：</label>
                    <input type="range" id="levelSlider" min="0" max="7" value="3" oninput="syncUI()" style="vertical-align: middle;">
