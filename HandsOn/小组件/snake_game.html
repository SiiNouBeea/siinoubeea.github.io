<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../../img/logo.png">
    <title>贪吃蛇游戏 - SiiNouBeea</title>
    <link rel="stylesheet" href="../../css/design-system.css">
    <style>
        /* 重置默认样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg-primary, #f5f7fa);
            color: var(--text-primary, #333);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 页面容器 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* 主要内容区域 */
        main {
            flex: 1;
            padding: 2rem 0;
            margin-top: var(--nav-height, 60px);
        }

        /* 游戏区域居中 */
        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* 导航按钮 */
        .nav-btn {
            display: inline-block;
            padding: 12px 24px;
            font-size: 1.1rem;
            cursor: pointer;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            text-decoration: none;
            text-align: center;
        }

        .nav-btn:hover {
            background: #45a049;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transform: translateY(-2px);
        }

        /* 保持原有游戏按钮样式 */
        #startBtn, #restartBtn {
            padding: 12px 24px;
            font-size: 1.1rem;
            margin: 20px;
            cursor: pointer;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }

        #startBtn:hover, #restartBtn:hover {
            background: #45a049;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transform: translateY(-2px);
        }

        /* 游戏结束弹窗 */
        #gameOver {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 2rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            text-align: center;
            min-width: 300px;
            z-index: 1000;
        }

        #gameOver p {
            font-size: 1.2rem;
            margin: 0 0 1rem 0;
            color: #333;
        }

        /* 分数显示 */
        .score-display {
            font-size: 1.2rem;
            font-weight: bold;
            background: white;
            padding: 10px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* 游戏画布 */
        canvas {
            border: 4px solid #2c3e50;
            border-radius: 8px;
            background: #f8f9fa;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* 泛光效果 */
        .glow {
            animation: glowPulse 0.5s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0% { filter: drop-shadow(0 0 15px var(--glow-color)); }
            50% { filter: drop-shadow(0 0 35px var(--glow-color)); }
            100% { filter: drop-shadow(0 0 15px var(--glow-color)); }
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .container {
                padding: 0 15px;
            }

            canvas {
                width: 95vw;
                height: auto;
            }
        }
    </style>
</head>
<body>
    <!-- ========== 导航栏 ========== -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="../../index.html" class="nav-logo">
                <img src="../../img/logo.png" alt="SiiNouBeea" class="nav-logo-img">
                <span>SiiNouBeea</span>
            </a>
            <div class="nav-links">
                <a href="../../index.html" class="nav-link">主页</a>
            </div>
            <button class="nav-toggle" aria-label="菜单" aria-expanded="false">☰</button>
        </div>
    </nav>

    <!-- 主要内容 -->
    <main>
        <div class="container">
            <div class="game-wrapper">
                <!-- 返回主页按钮 -->
                <a href="../../index.html" class="nav-btn">← 返回主页</a>

                <!-- 分数显示 -->
                <div class="score-display">当前分数：<span id="nowScore">0</span></div>

                <!-- 游戏控制按钮 -->
                <button id="startBtn">开始游戏</button>

                <!-- 游戏结束弹窗 -->
                <div id="gameOver">
                    <p>游戏结束！得分：<span id="finalScore"></span></p>
                    <button id="restartBtn">重新开始</button>
                </div>

                <!-- 游戏画布 -->
                <canvas id="gameCanvas" width="600" height="400"></canvas>
            </div>
        </div>
    </main>

    <!-- ========== 页脚 ========== -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <span class="neon-signature">SiiNouBeea</span>
                <p class="footer-copyright">© 2025 SiiNouBeea. Made with ❤️</p>
            </div>
        </div>
    </footer>

    <script src="../../js/main.js"></script>
    <script>
        const CELL_SIZE = 20;
        const CANVAS_WIDTH = 600;
        const CANVAS_HEIGHT = 400;
        const NORMAL_SPEED = 200;
        const BOOST_SPEED = 100;
        const BOOST_DURATION = 5000;
        const BASE_BLUE_PROBABILITY = 0.03;
        const BLUE_BLOCK_LIFESPAN = 40;

        class SnakeGame {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.nowScore = document.getElementById('nowScore');
                this.ctx = this.canvas.getContext('2d');
                this.startBtn = document.getElementById('startBtn');
                this.gameOverDiv = document.getElementById('gameOver');
                this.restartBtn = document.getElementById('restartBtn');
                this.finalScoreSpan = document.getElementById('finalScore');

                this.snake = [{ x: 10, y: 10 }];
                this.direction = 'right';
                this.nextDirection = 'right';
                this.apple = this.generateFood(false);
                this.blueBlock = null;
                this.blueBlockLifespan = 0;
                this.score = 0;
                this.gameLoop = null;
                this.isGameRunning = false;
                this.isBoosting = false;
                this.boostEndTime = 0;
                this.lastGlowUpdate = 0;
                this.glowColor = 'rgba(0, 255, 25, 0.8)';

                this.bindEvents();
                this.nowScore.textContent = this.score;
            }

            bindEvents() {
                this.startBtn.addEventListener('click', () => this.startGame());
                this.restartBtn.addEventListener('click', () => this.restartGame());
                document.addEventListener('keydown', (e) => this.handleKeyPress(e));
            }

            startGame() {
                this.isGameRunning = true;
                this.startBtn.style.display = 'none';
                this.gameOverDiv.style.display = 'none';
                this.resetGameState();
                this.updateGame();
            }

            restartGame() {
                this.isGameRunning = true;
                this.gameOverDiv.style.display = 'none';
                this.resetGameState();
                clearInterval(this.gameLoop);
                this.updateGame();
            }

            resetGameState() {
                this.snake = [{ x: 10, y: 10 }];
                this.direction = 'right';
                this.nextDirection = 'right';
                this.apple = this.generateFood(false);
                this.blueBlock = null;
                this.blueBlockLifespan = 0;
                this.score = 0;
                this.isBoosting = false;
                this.boostEndTime = 0;
                this.nowScore.textContent = this.score;
            }

            generateFood(isBlue) {
                let x, y;
                do {
                    x = Math.floor(Math.random() * (CANVAS_WIDTH / CELL_SIZE));
                    y = Math.floor(Math.random() * (CANVAS_HEIGHT / CELL_SIZE));
                } while (this.snake.some(segment => segment.x === x && segment.y === y));
                return { x, y, isBlue };
            }

            handleKeyPress(e) {
                if (!this.isGameRunning) return;
                switch (e.key) {
                    case 'ArrowUp': if (this.direction !== 'down') this.nextDirection = 'up'; break;
                    case 'ArrowDown': if (this.direction !== 'up') this.nextDirection = 'down'; break;
                    case 'ArrowLeft': if (this.direction !== 'right') this.nextDirection = 'left'; break;
                    case 'ArrowRight': if (this.direction !== 'left') this.nextDirection = 'right'; break;
                }
            }

            checkCollision() {
                const head = this.snake[0];
                if (head.x < 0 || head.x >= CANVAS_WIDTH / CELL_SIZE || head.y < 0 || head.y >= CANVAS_HEIGHT / CELL_SIZE) {
                    return true;
                }
                return this.snake.slice(1).some(segment => segment.x === head.x && segment.y === head.y);
            }

            updateGame() {
                if (!this.isGameRunning) return;

                this.direction = this.nextDirection;

                const head = { ...this.snake[0] };
                switch (this.direction) {
                    case 'up': head.y--; break;
                    case 'down': head.y++; break;
                    case 'left': head.x--; break;
                    case 'right': head.x++; break;
                }
                this.snake.unshift(head);

                if (head.x === this.apple.x && head.y === this.apple.y) {
                    this.score += 1;
                    if (this.isBoosting) {
                        this.score += 1;
                    }
                    this.apple = this.generateFood(false);
                    this.nowScore.textContent = this.score;
                } else {
                    this.snake.pop();
                }

                if (this.blueBlock) {
                    this.blueBlockLifespan--;
                    if (this.blueBlockLifespan <= 0) {
                        this.blueBlock = null;
                    }
                }

                const currentBlueProbability = this.isBoosting
                    ? BASE_BLUE_PROBABILITY * 1.5
                    : BASE_BLUE_PROBABILITY;

                if (!this.blueBlock && Math.random() < currentBlueProbability) {
                    this.blueBlock = this.generateFood(true);
                    this.blueBlockLifespan = BLUE_BLOCK_LIFESPAN;
                }

                if (this.blueBlock && head.x === this.blueBlock.x && head.y === this.blueBlock.y) {
                    this.score += 2;
                    this.nowScore.textContent = this.score;
                    this.isBoosting = true;
                    this.boostEndTime = Date.now() + BOOST_DURATION;
                    this.blueBlock = null;
                }

                if (this.isBoosting && Date.now() > this.boostEndTime) {
                    this.isBoosting = false;
                }

                const collision = this.checkCollision();
                if (collision) {
                    this.gameOver();
                    return;
                }

                this.draw();

                const speed = this.isBoosting ? BOOST_SPEED : NORMAL_SPEED;
                this.gameLoop = setTimeout(() => this.updateGame(), speed);
            }

            draw() {
                this.ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

                if (this.isBoosting) {
                    const now = Date.now();
                    const remainingBoostTime = this.boostEndTime - now;
                    const boostRatio = Math.max(0, remainingBoostTime / BOOST_DURATION);
                    const glowIntensity = 0.1 + boostRatio * 0.7;

                    if (now - this.lastGlowUpdate > 80000) {
                        this.lastGlowUpdate = now;
                        this.glowColor = this.glowColor === 'rgba(0, 255, 25, 0.8)'
                            ? 'rgba(0, 255, 0, 0.8)'
                            : 'rgba(0, 255, 0, 0.8)';
                    }

                    document.documentElement.style.setProperty('--glow-color', this.glowColor);
                    this.canvas.classList.add('glow');
                } else {
                    document.documentElement.style.setProperty('--glow-color', 'rgba(0, 0, 0, 0)');
                    this.canvas.classList.remove('glow');
                }

                this.ctx.fillStyle = '#0f0';
                this.snake.forEach((segment, index) => {
                    this.ctx.fillRect(segment.x * CELL_SIZE, segment.y * CELL_SIZE, CELL_SIZE - 1, CELL_SIZE - 1);
                });

                if (this.isBoosting) {
                    this.ctx.fillStyle = '#800080';
                } else {
                    this.ctx.fillStyle = '#f00';
                }
                this.ctx.fillRect(this.apple.x * CELL_SIZE, this.apple.y * CELL_SIZE, CELL_SIZE - 1, CELL_SIZE - 1);

                if (this.blueBlock) {
                    const opacity = this.blueBlockLifespan / BLUE_BLOCK_LIFESPAN;
                    this.ctx.fillStyle = `rgba(0, 0, 255, ${opacity})`;
                    this.ctx.fillRect(this.blueBlock.x * CELL_SIZE, this.blueBlock.y * CELL_SIZE, CELL_SIZE - 1, CELL_SIZE - 1);
                }
            }

            gameOver() {
                this.isGameRunning = false;
                this.isBoosting = false;
                this.boostEndTime = 0;
                this.finalScoreSpan.textContent = this.score;
                this.gameOverDiv.style.display = 'block';
                clearTimeout(this.gameLoop);
                this.canvas.classList.remove('glow');
            }
        }

        new SnakeGame();
    </script>
</body>
</html>
